services:
  db:
    image: postgres:16-alpine
    container_name: prome-db
    environment:
      POSTGRES_USER: prome
      POSTGRES_PASSWORD: prome
      POSTGRES_DB: prome
    ports:
      - "5432:5432"
    volumes:
      - prome-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prome -d prome"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  prome-db-data:
