# Quel che resta dello spike WP-14: la sola pagina di prova.
#
# LiveKit è passato in `docker-compose.prod.yml` quando lo spike ha risposto —
# lasciarlo in una cartella chiamata «spike» era il modo per dimenticarsene.
# Questa pagina resta finché C2 non è chiuso: serve a provare da una rete
# restrittiva senza passare da un account.
#
# Si unisce alla rete della produzione, perché la pagina la serve il Caddy che
# è già lì: due Caddy litigherebbero per le porte 80 e 443.
#
#   cd /home/deploy/prome/deploy/spike-livekit
#   sudo docker compose -f docker-compose.spike.yml up -d

name: prome-spike-livekit

services:
  # La pagina di prova, servita come file statici. L'immagine è la stessa di
  # Caddy, già presente sulla macchina: nessuno scaricamento in più.
  prova:
    image: caddy:2-alpine
    container_name: prova-audio
    restart: unless-stopped
    command: caddy file-server --root /srv --listen :80
    volumes:
      - ./prova:/srv:ro
    networks:
      - produzione
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '2'

networks:
  # La rete che docker compose ha già creato per il progetto `prome`.
  produzione:
    external: true
    name: prome_default
